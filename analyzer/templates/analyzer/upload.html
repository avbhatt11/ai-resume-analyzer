{% extends 'analyzer/base.html' %}
{% block content %}
<style>
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes spin { to { transform: rotate(360deg); } }
.upload-wrapper {
    min-height: 92vh; display: flex; align-items: center;
    justify-content: center; background: #1a2744; padding: 40px 20px;
}
.upload-card {
    background: #243057; border-radius: 16px; padding: 50px 40px;
    width: 100%; max-width: 500px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    animation: fadeInUp 0.8s ease;
    border: 1px solid #2a3a6a;
}
.upload-card h2 { text-align: center; color: white; margin-bottom: 30px; font-size: 1.8rem; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-weight: 600; color: #a0aec0; margin-bottom: 8px; }
.form-group input {
    width: 100%; padding: 14px 18px; border: 2px solid #2a3a6a;
    border-radius: 10px; font-size: 1rem; transition: border 0.3s;
    box-sizing: border-box; background: #1a2744; color: white;
}
.form-group input:focus { border-color: #4ecdc4; outline: none; }
.file-area {
    border: 2px dashed #4ecdc4; border-radius: 10px;
    padding: 30px; text-align: center; cursor: pointer;
    transition: background 0.3s; background: #1a2744;
}
.file-area:hover { background: #1f2f55; }
.file-area span { font-size: 2.5rem; display: block; }
.file-area p { color: #a0aec0; margin: 8px 0 0; }
.file-area input { display: none; }
.btn-upload {
    width: 100%; padding: 16px;
    background: #4ecdc4; color: #1a2744;
    border: none; border-radius: 10px;
    font-size: 1.1rem; font-weight: 800; cursor: pointer;
    margin-top: 10px; transition: all 0.3s;
}
.btn-upload:hover { background: #3dbdb5; transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(78,205,196,0.4); }
.loading { display: none; text-align: center; margin-top: 20px; }
.spinner {
    width: 45px; height: 45px; border: 4px solid #2a3a6a;
    border-top: 4px solid #4ecdc4; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 10px;
}
.loading p { color: #4ecdc4; font-weight: 600; }
#file-name { color: #4ecdc4; font-weight: 600; margin-top: 8px; font-size: 0.9rem; }
</style>

<div class="upload-wrapper">
    <div class="upload-card">
        <h2>📄 Upload Your Resume</h2>
        <form method="POST" enctype="multipart/form-data" id="uploadForm">
            {% csrf_token %}
            <div class="form-group">
                <label>👤 Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>📎 Resume (PDF only)</label>
                <div class="file-area" onclick="document.getElementById('fileInput').click()">
                    <span>☁️</span>
                    <p>Click to browse your PDF resume</p>
                    <input type="file" id="fileInput" name="resume_file" accept=".pdf" required
                           onchange="document.getElementById('file-name').innerText = this.files[0].name">
                </div>
                <p id="file-name"></p>
            </div>
            <button type="submit" class="btn-upload" onclick="showLoading()">
                ★ Analyze My Resume »
            </button>
        </form>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI is analyzing your resume... Please wait!</p>
        </div>
    </div>
</div>
<script>
function showLoading() {
    setTimeout(() => {
        document.getElementById('loading').style.display = 'block';
    }, 100);
}
</script>
{% endblock %}
